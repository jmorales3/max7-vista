<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Image Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
    }

    .icon svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 36px;
    }

    .spinner-track {
      width: 200px;
      height: 3px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .spinner-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 99px;
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { width: 0%;   margin-left: 0%; }
      50%  { width: 60%;  margin-left: 20%; }
      100% { width: 0%;   margin-left: 100%; }
    }

    .status {
      font-size: 12px;
      color: #64748b;
    }

    .version {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24">
      <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  </div>

  <h1>Patient Image Manager</h1>
  <p class="subtitle">Starting up…</p>

  <div class="spinner-track">
    <div class="spinner-bar"></div>
  </div>

  <p class="status" id="status">Initializing server</p>

  <p class="version" id="version"></p>

  <script>
    const statusEl = document.getElementById("status");

    // Real startup steps reported by the main process (see main.ts
    // sendStartupProgress calls). Falls back to a generic message if the
    // bridge isn't available (e.g. loaded outside Electron during dev).
    if (window.electronAPI && typeof window.electronAPI.onStartupProgress === "function") {
      window.electronAPI.onStartupProgress((step) => {
        statusEl.textContent = step;
      });
    } else {
      statusEl.textContent = "Starting…";
    }

    if (window.electronAPI && typeof window.electronAPI.getAppVersion === "function") {
      window.electronAPI.getAppVersion().then((version) => {
        document.getElementById("version").textContent = "v" + version;
      });
    }
  </script>
</body>
</html>
