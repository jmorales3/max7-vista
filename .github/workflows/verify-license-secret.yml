name: Verify License Secret

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: "Random test string to HMAC-sign (never the secret itself)"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compute HMAC of nonce with LICENSE_HMAC_SECRET
        env:
          LICENSE_HMAC_SECRET: ${{ secrets.LICENSE_HMAC_SECRET }}
          NONCE: ${{ github.event.inputs.nonce }}
        run: |
          node -e '
            const crypto = require("crypto");
            const sig = crypto.createHmac("sha256", process.env.LICENSE_HMAC_SECRET).update(process.env.NONCE).digest("hex");
            console.log("HMAC_RESULT=" + sig);
          '
