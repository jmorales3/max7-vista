openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Patient Image Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient operations
  - name: images
    description: Image operations
  - name: tags
    description: Tag management operations
  - name: presentations
    description: Presentation management operations
  - name: settings
    description: App settings operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List all patients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: tagIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated tag IDs. When present, only patients with at least one of these tags are returned.
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Create a new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "201":
          description: Created patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get a patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    patch:
      operationId: updatePatient
      tags: [patients]
      summary: Update a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientUpdate"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Not found
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Delete a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: One or more of the patient's images are referenced by saved presentations. Retry with `?force=true` on the query string to delete anyway and remove those references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationReferenceConflict"

  /patients/{id}/tags:
    get:
      operationId: listPatientTags
      tags: [patients]
      summary: List tags for a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: addPatientTag
      tags: [patients]
      summary: Add a tag to a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientTagInput"
      responses:
        "201":
          description: Tag added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "404":
          description: Patient or tag not found
        "409":
          description: Tag already assigned

  /patients/{id}/tags/{tagId}:
    delete:
      operationId: removePatientTag
      tags: [patients]
      summary: Remove a tag from a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tagId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Tag removed
        "404":
          description: Not found

  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: List all available tags
      responses:
        "200":
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      operationId: createTag
      tags: [tags]
      summary: Create a new tag (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "409":
          description: Tag name already exists

  /tags/{id}:
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a tag (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /presentations:
    get:
      operationId: listPresentations
      tags: [presentations]
      summary: List presentations, optionally filtered by patient
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of presentations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Presentation"
    post:
      operationId: createPresentation
      tags: [presentations]
      summary: Create a new presentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationInput"
      responses:
        "201":
          description: Created presentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"

  /presentations/{id}:
    get:
      operationId: getPresentation
      tags: [presentations]
      summary: Get a presentation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Presentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"
        "404":
          description: Not found
    put:
      operationId: updatePresentation
      tags: [presentations]
      summary: Update a presentation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationUpdate"
      responses:
        "200":
          description: Updated presentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Presentation"
        "404":
          description: Not found
    delete:
      operationId: deletePresentation
      tags: [presentations]
      summary: Delete a presentation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /patients/{id}/images:
    get:
      operationId: listPatientImages
      tags: [images]
      summary: List images for a patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Image"

  /images/reorder:
    post:
      operationId: reorderImages
      tags: [images]
      summary: Persist a custom manual ordering for a patient's images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderImagesInput"
      responses:
        "200":
          description: Updated images in new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Image"

  /images:
    get:
      operationId: listImages
      tags: [images]
      summary: List all images with optional patient filter
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: integer
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
        - name: tagIds
          in: query
          required: false
          description: Comma-separated tag IDs. When present, only images whose patient has at least one of these tags are returned.
          schema:
            type: string
        - name: onlyTagged
          in: query
          required: false
          description: When true and tagIds is not set, only images whose patient has at least one tag are returned (sorted by tag name). Prevents dumping every image of every patient when no specific tag filter is chosen.
          schema:
            type: boolean
      responses:
        "200":
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Image"
    post:
      operationId: uploadImage
      tags: [images]
      summary: Upload a new image (multipart/form-data with file + metadata)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUploadInput"
      responses:
        "201":
          description: Uploaded image record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"

  /images/export-zip:
    post:
      operationId: exportImagesZip
      tags: [images]
      summary: Export a set of images (patient images and/or library assets) as a ZIP file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportImagesZipInput"
      responses:
        "200":
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: No images found

  /images/{id}:
    get:
      operationId: getImage
      tags: [images]
      summary: Get image metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          description: Not found
    patch:
      operationId: updateImage
      tags: [images]
      summary: Update image metadata or annotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUpdate"
      responses:
        "200":
          description: Updated image record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          description: Not found
    delete:
      operationId: deleteImage
      tags: [images]
      summary: Delete an image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Image is referenced by one or more saved presentations. Retry with `?force=true` on the query string to delete anyway and remove those references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationReferenceConflict"

  /images/{id}/file:
    put:
      operationId: replaceImageFile
      tags: [images]
      summary: Replace the stored image file (persists crop/rotate/annotate edits)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageFileReplaceInput"
      responses:
        "200":
          description: Updated image record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          description: Not found
    get:
      operationId: getImageFile
      tags: [images]
      summary: Serve the raw image file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image binary
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Not found

  /images/stats:
    get:
      operationId: getImageStats
      tags: [images]
      summary: Get image statistics summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageStats"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get app settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update app settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /settings/scan-directory:
    post:
      operationId: scanDirectory
      tags: [settings]
      summary: Scan storage directory and index untracked images
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Patient:
      type: object
      required: [id, name, patientCode, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        patientCode:
          type: string
        dateOfBirth:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        imageCount:
          type: integer
        legalHold:
          type: boolean
        legalHoldReason:
          type: ["string", "null"]
        legalHoldSetAt:
          type: ["string", "null"]
        profileImageId:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
              name:
                type: string

    ImageUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The image file to upload
        patientId:
          type: integer
        notes:
          type: string
        capturedAt:
          type: string

    ImageFileReplaceInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Replacement image file (used to persist crop/rotate/annotate edits)

    PatientInput:
      type: object
      required: [name, patientCode]
      properties:
        name:
          type: string
          minLength: 1
        patientCode:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
        notes:
          type: string

    PatientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        patientCode:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
        notes:
          type: string
        profileImageId:
          type: ["integer", "null"]

    Image:
      type: object
      required: [id, filePath, capturedAt, createdAt]
      properties:
        id:
          type: integer
        patientId:
          type: ["integer", "null"]
        patientName:
          type: ["string", "null"]
        patientCode:
          type: ["string", "null"]
        filePath:
          type: string
        fileName:
          type: string
        notes:
          type: ["string", "null"]
        annotation:
          type: ["string", "null"]
        capturedAt:
          type: string
        createdAt:
          type: string
        isUnassigned:
          type: boolean
        derivedFromImageId:
          type: ["integer", "null"]

    ExportImagesZipInput:
      type: object
      required: [imageIds]
      properties:
        imageIds:
          type: array
          items:
            type: integer

    ImageUpdate:
      type: object
      properties:
        notes:
          type: string
        annotation:
          type: string

    ReorderImagesInput:
      type: object
      required: [patientId, orderedIds]
      properties:
        patientId:
          type: integer
        orderedIds:
          type: array
          items:
            type: integer

    ImageStats:
      type: object
      required: [totalImages, totalPatients, unassignedImages, recentUploads]
      properties:
        totalImages:
          type: integer
        totalPatients:
          type: integer
        unassignedImages:
          type: integer
        recentUploads:
          type: integer

    Settings:
      type: object
      required: [storageDirectory]
      properties:
        storageDirectory:
          type: string
        lastScanAt:
          type: ["string", "null"]

    SettingsUpdate:
      type: object
      properties:
        storageDirectory:
          type: string

    Tag:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string

    TagInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    PatientTagInput:
      type: object
      required: [tagId]
      properties:
        tagId:
          type: integer

    Presentation:
      type: object
      required: [id, title, slides, createdAt, updatedAt]
      properties:
        id:
          type: integer
        patientId:
          type: ["integer", "null"]
        title:
          type: string
        slides:
          type: array
          items: {}
        createdAt:
          type: string
        updatedAt:
          type: string

    PresentationReferenceConflict:
      type: object
      required: [error, presentations]
      properties:
        error:
          type: string
        presentations:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: integer
              title:
                type: string

    PresentationInput:
      type: object
      required: [title, slides]
      properties:
        patientId:
          type: integer
        title:
          type: string
          minLength: 1
        slides:
          type: array
          items: {}

    PresentationUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        slides:
          type: array
          items: {}

    ScanResult:
      type: object
      required: [scanned, indexed, skipped]
      properties:
        scanned:
          type: integer
        indexed:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        message:
          type: string
